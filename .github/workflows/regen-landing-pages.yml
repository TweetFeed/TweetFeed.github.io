name: Regenerate tag landing pages

# This workflow uses no untrusted input from issues / PRs / commits.
# Safe to run scheduled and via manual dispatch.

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC; counts.json on the data repo updates around 07:00 daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-landing-pages
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: bump_sitemap_lastmod.py derives every URL's lastmod
          # from git log; with the default shallow clone it would silently keep
          # the committed value forever.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests jinja2 pyyaml

      - name: formatDateLong UTC test
        # Feed timestamps are UTC but arrive space-separated, which V8 parses as
        # local time; this pins the rendering across viewer timezones.
        run: node scripts/test_utils_dates.js

      - name: Tag sample exact-match test
        # Guards the substring-vs-exact bug: the API path filter is a substring
        # match, so /v1/month/scam also returns #cryptoscam. Runs before the
        # regen so a broken filter never reaches the committed pages.
        run: python3 scripts/test_tag_samples.py

      - name: Regenerate tag pages
        run: python3 scripts/regen_tag_pages.py

      # Bakes a real IOC count + generation timestamp into the 5 malicious-*
      # pages and /trends/, so their lastmod (set below) reflects a genuine
      # content change instead of a hardcoded "today". Must run before the
      # consistency gate so the gate checks what actually gets committed.
      - name: Bake freshness (malicious-* + trends)
        run: python3 scripts/bake_freshness.py

      # Keeps each /malicious-*/ page's "Nk+ ... past year" claim true against
      # the rolling 365-day feed. Added 2026-08-23 after the gate below took
      # the whole daily commit down: the claim was hand-typed from a real
      # count that then moved, which is a scheduled failure, not a one-off.
      # Must run BEFORE the gate, and reads the same source it does.
      - name: Bake year-window counts (malicious-*)
        run: python3 scripts/bake_year_counts.py

      # Fails the run (nothing gets pushed) if the regenerated pages break a
      # site invariant, e.g. a footer-breakpoint regression baked into a template.
      - name: Consistency gate
        run: python3 scripts/check_consistency.py

      - name: Refresh sitemap lastmod (real content-change dates)
        run: python3 scripts/bump_sitemap_lastmod.py

      - name: Commit and push if changed
        run: |
          git config user.name  "tweetfeed-bot"
          git config user.email "tweetfeed-bot@phishunt.io"
          # tags/ was missing: regen_tag_pages.render_tags_index() rewrites
          # tags/index.html on every run but it was never staged, so the hub
          # silently stayed stale in git while CI reported success. malicious-*/
          # and trends/ were added 2026-08-22 alongside bake_freshness.py.
          git add tag/ tags/ malicious-domains/ malicious-ips/ malicious-urls/ \
                  malicious-hashes-md5/ malicious-hashes-sha256/ trends/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "regen tag landing pages: daily refresh"
          git push
