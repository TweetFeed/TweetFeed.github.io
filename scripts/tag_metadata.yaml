      q: "What is Kimsuky?"
      a: "A DPRK-aligned APT group active since at least 2012. It targets South Korean government, defense and academic groups, and is known for spear-phishing and custom backdoors."
    faq_q2:
      q: "Is Kimsuky the same as Lazarus?"
      a: "No, they are separate DPRK-aligned clusters: Lazarus focuses on financial gain, Kimsuky on intelligence collection. TweetFeed tracks #Lazarus IOCs separately."
