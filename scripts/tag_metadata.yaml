      a: "A fake error or CAPTCHA page tells the victim to paste a command, already copied by its JavaScript, into Run or a terminal. MITRE tracks it as T1204.004."
    faq_q2:
      q: "Why does ClickFix work if the victim has to run the command themselves?"
      a: "The victim runs the code, so it skips the download-and-double-click chain that most browser and endpoint defenses watch. People click through CAPTCHAs fast, so the step looks normal."
